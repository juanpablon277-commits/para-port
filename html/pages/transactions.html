<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/transaction.css">

    <title>Transação - Controle de gastos</title>
</head>

<body>
    <header>

        <button type="button" class="clear" onclick="logout()">Sair</button>

    </header>

    <ol id="transactions"></ol>

    <main class="centralize">
        <form>
            <div class="form-field">
                <div><label>Transação *</label></div>
                <input type="radio" name="type" checked id="expense">
                <label for="expense">Despesa</label>
                <input type="radio" name="type" id="income">
                <label for="income">Receita</label>
            </div>
            <div class="form-field">
                <div><label>Data da Transação *</label></div>
                <input type="date" onchange="onChangeDate()" id="date">
                <div class="error" id="date-required-error">
                    Data é obrigatória / Inválida
                </div>

            </div>
            <div class="form-field">
                <div><label>Moeda *</label></div>
                <select id="currency">
                    <option value="USD">Dólar</option>
                    <option value="EUR">Euro</option>
                    <option value="BRL" selected>Real</option>
                </select>
            </div>
            <div class="form-field">
                <div><label>Valor *</label></div>
                <input type="number" id="value" onchange="onChangeValue()">
                <div class="error" id="value-required-error">
                    Valor é obrigatório / Inválido
                </div>
                <div class="error" id="value-less-or-equal-to-zero-error">
                    Valor deve ser maior que zero
                </div>
            </div>
            <div class="form-field">
                <div><label>Tipo de Transação *</label></div>
                <select onchange="onChangeTransactionType()" id="transaction-type">
                    <option value="">--Selecione um tipo de transação--</option>
                    <option>Acomodação</option>
                    <option>Alimentação</option>
                    <option>Outros</option>
                    <option>Salário</option>
                    <option>Supermercado</option>
                    <option>Transporte</option>
                </select>
                <div class="error" id="transaction-type-required-error">
                    Tipo de transação é obrigatória
                </div>
            </div>

            <div class="form-field">
                <div><label>Descrição </label></div>
                <input type="text" id="description">
            </div>

            <button type="button" class="solid" disabled id="save-button" onclick="saveTransaction()">Salvar</button>
            <button type="button" class="clear" style="color:#000000;" onclick="window.location.href='../../html/pages/home/home.html'">Cancelar</button>
        </form>
    </main>

</body>



<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore-compat.js"></script>
<script src="../../../js/firebase-init.js"></script>
<script src="../../../js/auth-guard.js"></script>
<script src="../../../js/loading.js"></script>
<script src="../../../services/transactions.services.js"></script>
<script src="../../../js/transaction.js"></script>





</html>
